name: update schedule

on:
  schedule:
    # UTC 19:17 对应 北京时间 (UTC+8) 每天凌晨 03:17
    - cron: "17 19 * * *"
  workflow_dispatch: # 支持在 GitHub 网页上手动触发测试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Generate m3u
        run: pnpm m3u
        env:
          IPTV_PROXY_IP_RANGES: ${{ vars.IPTV_PROXY_IP_RANGES }}
          IPTV_PROXY_PORT: ${{ vars.IPTV_PROXY_PORT }}

      - name: Publish m3u (Cloudflare direct upload or trigger Pages build)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            pnpm static
            find m3u -maxdepth 2
            npx wrangler pages deploy m3u --project-name="${PROJECT_NAME}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: schedule refresh (trigger Cloudflare Pages build)"
            git push origin HEAD:${{ github.ref_name }}
          fi
