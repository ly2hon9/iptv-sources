<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="766" viewBox="0 0 1800 766">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4ff"/>
      <stop offset="1" stop-color="#e9faf5"/>
    </linearGradient>
    <linearGradient id="switchOn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f1147" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f1147" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 72px; font-weight: 700; fill: #1f1147; }
      .subtitle { font-size: 36px; font-weight: 500; fill: #4c3d8f; }
      .tag { font-size: 26px; font-weight: 600; fill: #ffffff; }
      .label { font-size: 30px; font-weight: 600; fill: #1f1147; }
      .small { font-size: 24px; fill: #5b5577; }
      .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1800" height="766" fill="url(#bg)"/>
  <circle cx="1620" cy="80" r="260" fill="#7c3aed" opacity="0.06"/>
  <circle cx="140" cy="720" r="220" fill="#10b981" opacity="0.08"/>

  <!-- left: text block -->
  <g class="cn">
    <rect x="110" y="128" width="236" height="46" rx="23" fill="url(#accent)"/>
    <text x="228" y="160" text-anchor="middle" class="tag">运营商 IPTV 系列</text>

    <text x="110" y="268" class="title">中兴巡天路由器</text>
    <text x="110" y="358" class="title">两个开关看 IPTV</text>

    <text x="110" y="432" class="subtitle">免刷 OpenWrt · 原厂固件自带 IGMP 代理</text>

    <text x="110" y="510" class="small">北京联通 · 光猫无需 IPTV 专口 · 任意 LAN 口接路由器 WAN 口</text>
  </g>

  <!-- right: settings card -->
  <g transform="translate(1040 150)">
    <rect x="0" y="0" width="650" height="466" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <!-- card header -->
    <rect x="0" y="0" width="650" height="72" rx="28" fill="#f3f0ff"/>
    <rect x="0" y="40" width="650" height="32" fill="#f3f0ff"/>
    <g class="cn">
      <text x="36" y="48" class="label" fill="#4c3d8f">应用 › 组播</text>
      <text x="614" y="48" text-anchor="end" class="small">IPv4</text>
    </g>

    <!-- row 1: IGMP 代理 -->
    <g class="cn">
      <text x="40" y="162" class="label">IGMP 代理</text>
      <text x="40" y="198" class="small">把内网 IGMP 加入请求转发到 WAN</text>
      <g transform="translate(520 130)">
        <rect x="0" y="0" width="92" height="46" rx="23" fill="url(#switchOn)" filter="url(#softShadow)"/>
        <circle cx="69" cy="23" r="18" fill="#ffffff"/>
      </g>
    </g>

    <line x1="40" y1="236" x2="610" y2="236" stroke="#ece9f7" stroke-width="2"/>

    <!-- row 2: IGMP 监听 -->
    <g class="cn">
      <text x="40" y="304" class="label">IGMP 监听</text>
      <text x="40" y="340" class="small">只向订阅了的端口转发组播流</text>
      <g transform="translate(520 272)">
        <rect x="0" y="0" width="92" height="46" rx="23" fill="url(#switchOn)" filter="url(#softShadow)"/>
        <circle cx="69" cy="23" r="18" fill="#ffffff"/>
      </g>
    </g>

    <!-- submit button -->
    <g transform="translate(245 390)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="#3b82f6" filter="url(#softShadow)"/>
      <text x="80" y="34" text-anchor="middle" class="cn tag">提 交</text>
    </g>
  </g>

  <!-- bottom: mini topology -->
  <g transform="translate(110 600)" class="cn">
    <!-- 光猫 -->
    <rect x="0" y="0" width="190" height="64" rx="14" fill="#ffffff" stroke="#c9c2ea" stroke-width="2" filter="url(#softShadow)"/>
    <text x="95" y="41" text-anchor="middle" class="label">光猫 LAN</text>

    <line x1="200" y1="32" x2="300" y2="32" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- 路由器 -->
    <rect x="310" y="0" width="260" height="64" rx="14" fill="#ffffff" stroke="#c9c2ea" stroke-width="2" filter="url(#softShadow)"/>
    <text x="440" y="41" text-anchor="middle" class="label">中兴巡天 WAN</text>

    <line x1="580" y1="32" x2="680" y2="32" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- 播放器 -->
    <rect x="690" y="0" width="210" height="64" rx="14" fill="#ffffff" stroke="#c9c2ea" stroke-width="2" filter="url(#softShadow)"/>
    <text x="795" y="41" text-anchor="middle" class="label">VLC / Kodi</text>
  </g>
</svg>
