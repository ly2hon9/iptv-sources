<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4ff"/>
      <stop offset="1" stop-color="#e9faf5"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f1147" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 700; fill: #1f1147; }
      .subtitle { font-size: 23px; fill: #5b4a82; }
      .node-title { font-size: 27px; font-weight: 700; fill: #1f1147; }
      .node-desc { font-size: 19px; fill: #5b4a82; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 17px; fill: #5b4a82; }
      .sub { font-size: 18px; fill: #4b3a72; }
      .url { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 18px; fill: #4c1d95; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="210" fill="#e9d5ff" opacity="0.55"/>
  <circle cx="120" cy="810" r="250" fill="#ccfbf1" opacity="0.55"/>
  <text x="800" y="82" text-anchor="middle" class="cn title">igmpproxy 家庭 IPTV 拓扑</text>
  <text x="800" y="120" text-anchor="middle" class="cn subtitle">OpenWrt 直接转发运营商 UDP/RTP 组播，播放器按原始地址订阅</text>
  <g filter="url(#shadow)">
    <rect x="70" y="250" width="300" height="220" rx="28" fill="#ffffff" stroke="#ddd6fe" stroke-width="3"/>
    <circle cx="220" cy="315" r="40" fill="#f5f3ff"/>
    <path d="M187 321 Q220 285 253 321 M198 332 Q220 308 242 332 M212 344 Q220 336 228 344" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
    <text x="220" y="395" text-anchor="middle" class="cn node-title">运营商 IPTV 网络</text>
    <text x="220" y="432" text-anchor="middle" class="cn node-desc">UDP / RTP 组播频道</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="475" y="250" width="300" height="220" rx="28" fill="#ffffff" stroke="#ffd591" stroke-width="3"/>
    <rect x="575" y="287" width="100" height="58" rx="12" fill="#fff7e6" stroke="#fa8c16" stroke-width="4"/>
    <circle cx="595" cy="316" r="5" fill="#52c41a"/>
    <circle cx="615" cy="316" r="5" fill="#52c41a"/>
    <circle cx="635" cy="316" r="5" fill="#faad14"/>
    <text x="625" y="395" text-anchor="middle" class="cn node-title">运营商光猫</text>
    <text x="625" y="432" text-anchor="middle" class="cn node-desc">IPTV 专用 LAN 口（如 LAN4）</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="880" y="215" width="340" height="290" rx="30" fill="url(#router)"/>
    <path d="M990 290 L990 330 M1110 290 L1110 330" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <rect x="960" y="325" width="180" height="58" rx="13" fill="#ffffff" opacity="0.94"/>
    <circle cx="992" cy="354" r="6" fill="#52c41a"/>
    <circle cx="1018" cy="354" r="6" fill="#52c41a"/>
    <circle cx="1044" cy="354" r="6" fill="#52c41a"/>
    <text x="1050" y="425" text-anchor="middle" class="cn node-title" fill="#ffffff">OpenWrt 路由器</text>
    <text x="1050" y="459" text-anchor="middle" class="cn" font-size="20" fill="#ede9fe">igmpproxy · 组播路由</text>
    <text x="1050" y="486" text-anchor="middle" class="cn" font-size="17" fill="#c4b5fd">IGMP Snooping 智能转发</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1325" y="180" width="210" height="180" rx="28" fill="#ffffff" stroke="#b7eb8f" stroke-width="3"/>
    <rect x="1380" y="216" width="100" height="65" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="4"/>
    <path d="M1412 298 H1448 M1430 281 V298" stroke="#52c41a" stroke-width="5" stroke-linecap="round"/>
    <text x="1430" y="335" text-anchor="middle" class="cn node-title">支持 UDP</text>
    <text x="1430" y="361" text-anchor="middle" class="cn node-desc">播放器</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1325" y="380" width="210" height="180" rx="28" fill="#ffffff" stroke="#b7eb8f" stroke-width="3"/>
    <rect x="1380" y="416" width="100" height="65" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="4"/>
    <path d="M1412 498 H1448 M1430 481 V498" stroke="#52c41a" stroke-width="5" stroke-linecap="round"/>
    <text x="1430" y="535" text-anchor="middle" class="cn node-title">机顶盒</text>
    <text x="1430" y="561" text-anchor="middle" class="cn node-desc">Android TV · Kodi</text>
  </g>
  <line x1="370" y1="360" x2="455" y2="360" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="412" y="330" text-anchor="middle" class="cn label" fill="#7c3aed">组播</text>
  <line x1="775" y1="360" x2="860" y2="360" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="817" y="330" text-anchor="middle" class="cn label" fill="#7c3aed">IPTV 网线</text>
  <line x1="1220" y1="280" x2="1305" y2="270" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="1262" y="240" text-anchor="middle" class="cn label" fill="#7c3aed">UDP 组播</text>
  <text x="1262" y="263" text-anchor="middle" class="cn small">LAN / Wi-Fi</text>
  <line x1="1220" y1="440" x2="1305" y2="470" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="1262" y="495" text-anchor="middle" class="cn label" fill="#7c3aed">UDP 组播</text>
  <text x="1262" y="518" text-anchor="middle" class="cn small">LAN / Wi-Fi</text>
  <g filter="url(#shadow)">
    <rect x="245" y="610" width="1110" height="200" rx="26" fill="#ffffff" stroke="#cfe5e2" stroke-width="2"/>
    <rect x="285" y="640" width="170" height="54" rx="27" fill="#ede9fe"/>
    <text x="370" y="675" text-anchor="middle" class="cn label" fill="#7c3aed">播放器订阅</text>
    <text x="485" y="676" class="url">rtp://239.3.1.159:8000</text>
    <line x1="285" y1="715" x2="1315" y2="715" stroke="#e8edf2" stroke-width="2"/>
    <text x="285" y="747" class="cn sub">说明：地址来自运营商原始组播源，igmpproxy 仅按 IGMP 订阅关系把组播从 wan 透传到 lan。</text>
    <text x="285" y="775" class="cn sub">优势：播放器直连组播，不需要 udpxy 的 HTTP 转换，也没有单播带宽放大。</text>
    <text x="285" y="798" class="cn small" fill="#7c3aed">注意：需要播放端运行 IGMP，加入组播组时仍可能有 10 秒级握手延迟。</text>
  </g>
  <text x="800" y="864" text-anchor="middle" class="cn small">iptv-sources · 在 OpenWrt 上用 igmpproxy 替代 udpxy</text>
</svg>
